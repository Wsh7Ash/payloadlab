[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "payloadlab"
version = "1.0.0"
description = "50 validated proof-of-concept authoring skills plus a poc CLI for authorized testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["proof-of-concept", "evidence", "agent-skills", "security", "authorized-testing"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
payloadlab = "payloadlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"